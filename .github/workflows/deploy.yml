name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages (custom domain
# tigris-ml.dev via public/CNAME). The site serves docs at the root, so no
# /docs -> / redirect is needed; old /docs/* links are not carried over.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the Pages deployment (OIDC id-token + pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deployment at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Starlight's `lastUpdated` resolves git commit dates.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` also runs the link validator; PRs get it for free.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deploy only on a push to main; PRs build (and validate) but don't publish.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
